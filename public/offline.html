<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tidak Ada Koneksi — PANIC BUTTON</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0a0a0b;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        max-width: 360px;
        text-align: center;
        padding: 32px 24px;
      }
      .icon {
        font-size: 56px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .note {
        margin-top: 16px;
        font-size: 12px;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>Tidak Ada Koneksi Internet</h1>
      <p>
        PANIC BUTTON butuh koneksi internet untuk mengirim alarm darurat secara
        real-time. Silakan periksa koneksi Wi-Fi atau data seluler kamu.
      </p>
      <button onclick="window.location.reload()">Coba Lagi</button>
      <p class="note">
        Jika ini keadaan darurat dan tidak ada internet, segera hubungi kontak
        darurat kamu secara langsung melalui telepon.
      </p>
    </div>
  </body>
</html>
